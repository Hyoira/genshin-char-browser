name: Update Characters

on:
  push:
    branches:
      - master
  schedule:
    # 毎週金曜 13:17 JST (4:17 UTC)
    - cron: '17 4 * * 5'
  workflow_dispatch: # 手動実行も可能

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      should_deploy: ${{ steps.deploy-check.outputs.should_deploy }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Update genshin-db to latest
        run: npm install genshin-db@latest
      
      - name: Fetch latest character data
        run: node fetch_characters.js

      - name: Generate internal data
        run: npm run generate-data
      
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet src/ package.json package-lock.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ package.json package-lock.json
          git commit -m "chore: update character and talent data"
          git push

      - name: Check whether to deploy
        id: deploy-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATA_CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$DATA_CHANGED" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Build
        if: steps.deploy-check.outputs.should_deploy == 'true'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.deploy-check.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.deploy-check.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: needs.update.outputs.should_deploy == 'true'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
